<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grimoire</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-plus"><path d="M12 5v14M5 12h14"/></g>
    <g id="i-search"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></g>
    <g id="i-pin"><path d="M9 3h6l-1 6 3 4H7l3-4-1-6zM12 13v8"/></g>
    <g id="i-trash"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/></g>
    <g id="i-link"><path d="M8 4H5v16h3M16 4h3v16h-3M10 4H9v16h1M14 4h1v16h-1"/></g>
    <g id="i-task"><rect x="4" y="4" width="16" height="16"/><path d="M8 12l3 3 5-6"/></g>
    <g id="i-head"><path d="M5 5v14M13 5v14M5 12h8M17 10l3-1v10"/></g>
    <g id="i-bold"><path d="M7 5h6a3.5 3.5 0 010 7H7zM7 12h7a3.5 3.5 0 010 7H7z"/></g>
    <g id="i-hash"><path d="M9 4L7 20M17 4l-2 16M4 9h16M3.5 15h16"/></g>
    <g id="i-web"><circle cx="6" cy="7" r="2.2"/><circle cx="18" cy="6" r="2.2"/><circle cx="13" cy="18" r="2.2"/><path d="M8 7.2l8-.9M7 9l5 7M17 8l-3 8"/></g>
    <g id="i-notes"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/></g>
    <g id="i-page"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></g>
    <g id="i-more"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></g>
    <g id="i-back"><path d="M14 5l-7 7 7 7"/></g>
    <g id="i-fit"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></g>
    <g id="i-minus"><path d="M5 12h14"/></g>
    <g id="i-moon"><path d="M19 14.5A8 8 0 019.5 5 7.5 7.5 0 1019 14.5z"/></g>
    <g id="i-share"><path d="M12 15V3M7 8l5-5 5 5M5 12v8h14v-8"/></g>
    <g id="i-copy"><rect x="8" y="8" width="12" height="12"/><path d="M16 8V4H4v12h4"/></g>
  </defs>
</svg>

<div id="app" data-view="notes" data-mode="read" data-has="0" data-ready="0">

  <!-- ============ index rail ============ -->
  <aside class="rail" aria-label="Index des notes">
    <header class="rail-head">
      <h1 class="mark">Grimoire</h1>
      <button class="sync" id="sync" type="button" data-state="opening" aria-haspopup="dialog" aria-controls="syncPop">
        <i class="dot" aria-hidden="true"></i><span id="syncLabel">Ouverture</span>
      </button>
    </header>

    <div class="seg" role="tablist" aria-label="Vue">
      <button type="button" role="tab" data-go="notes" id="segNotes">Notes</button>
      <button type="button" role="tab" data-go="graphe" id="segWeb">Graphe</button>
    </div>

    <label class="search" for="q">
      <svg class="ic" viewBox="0 0 24 24"><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="Chercher ou créer" autocomplete="off" spellcheck="false">
    </label>

    <div class="rail-actions">
      <button type="button" class="btn solid" id="newNote"><svg class="ic" viewBox="0 0 24 24"><use href="#i-plus"/></svg>Nouvelle note</button>
      <button type="button" class="btn" id="daily" title="Ouvrir la note du jour"><svg class="ic" viewBox="0 0 24 24"><use href="#i-moon"/></svg>Journal</button>
    </div>

    <div class="tags" id="tags" aria-label="Étiquettes"></div>

    <ol class="list" id="list"></ol>

    <footer class="rail-foot">
      <span id="counts" class="counts">&nbsp;</span>
      <button type="button" class="icon-btn" id="menuBtn" aria-label="Exporter, importer" aria-haspopup="menu" aria-controls="menu"><svg class="ic" viewBox="0 0 24 24"><use href="#i-more"/></svg></button>
    </footer>
  </aside>

  <!-- ============ stage ============ -->
  <main class="stage">

    <div class="note-view" id="noteView">
      <section class="page" id="page" aria-label="Note">

        <div class="bar" id="bar">
          <div class="bar-row">
            <button type="button" class="icon-btn only-phone" data-go="notes" aria-label="Retour aux notes"><svg class="ic" viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
            <div class="seg small" role="tablist" aria-label="Mode">
              <button type="button" role="tab" data-mode="read" id="mRead">Lire</button>
              <button type="button" role="tab" data-mode="write" id="mWrite">Écrire</button>
            </div>
            <div class="fmt" id="fmt" aria-label="Mise en forme">
              <button type="button" class="icon-btn" data-fmt="link" title="Lier une note [[ ]]" aria-label="Lier une note"><svg class="ic" viewBox="0 0 24 24"><use href="#i-link"/></svg></button>
              <button type="button" class="icon-btn" data-fmt="task" title="Case à cocher" aria-label="Case à cocher"><svg class="ic" viewBox="0 0 24 24"><use href="#i-task"/></svg></button>
              <button type="button" class="icon-btn" data-fmt="head" title="Titre" aria-label="Titre"><svg class="ic" viewBox="0 0 24 24"><use href="#i-head"/></svg></button>
              <button type="button" class="icon-btn" data-fmt="bold" title="Gras" aria-label="Gras"><svg class="ic" viewBox="0 0 24 24"><use href="#i-bold"/></svg></button>
              <button type="button" class="icon-btn" data-fmt="tag" title="Étiquette" aria-label="Étiquette"><svg class="ic" viewBox="0 0 24 24"><use href="#i-hash"/></svg></button>
            </div>
            <span class="grow"></span>
            <i class="dot only-phone" id="syncDot" data-state="opening" aria-hidden="true"></i>
            <button type="button" class="icon-btn" id="shareBtn" title="Partager, exporter" aria-label="Partager ou exporter la note" aria-haspopup="menu" aria-controls="shareMenu"><svg class="ic" viewBox="0 0 24 24"><use href="#i-share"/></svg></button>
            <button type="button" class="icon-btn" id="pinBtn" title="Épingler" aria-label="Épingler" aria-pressed="false"><svg class="ic" viewBox="0 0 24 24"><use href="#i-pin"/></svg></button>
            <button type="button" class="icon-btn" id="delBtn" title="Supprimer la note" aria-label="Supprimer la note"><svg class="ic" viewBox="0 0 24 24"><use href="#i-trash"/></svg></button>
          </div>
          <div class="suggest" id="suggest" hidden></div>
        </div>

        <article class="sheet" id="sheet">
          <input id="title" class="title" type="text" placeholder="Sans titre" autocomplete="off" spellcheck="true" aria-label="Titre de la note">
          <p class="meta" id="meta">&nbsp;</p>
          <textarea id="body" class="body" spellcheck="true" placeholder="Écris. Tape [[ pour lier une autre note, # pour une étiquette." aria-label="Texte de la note"></textarea>
          <div class="read" id="read"></div>
        </article>

        <div class="blank" id="blank">
          <p class="blank-mark" aria-hidden="true">G</p>
          <p class="blank-t" id="blankT">Ouverture du grimoire</p>
          <p class="blank-x" id="blankX">Les notes arrivent.</p>
          <button type="button" class="btn solid" id="blankNew" hidden><svg class="ic" viewBox="0 0 24 24"><use href="#i-plus"/></svg>Nouvelle note</button>
        </div>
      </section>

      <aside class="context" id="context" aria-label="Liens de la note">
        <div class="ctx-web">
          <h2 class="eyebrow">Voisinage</h2>
          <canvas id="mini" aria-label="Graphe des notes liées à celle-ci"></canvas>
        </div>
        <section>
          <h2 class="eyebrow">Citée par <span id="backN" class="n"></span></h2>
          <ul class="ties" id="backs"></ul>
        </section>
        <section>
          <h2 class="eyebrow">Cite <span id="outN" class="n"></span></h2>
          <ul class="ties" id="outs"></ul>
        </section>
      </aside>
    </div>

    <section class="web" id="web" aria-label="Graphe des notes">
      <canvas id="graph" aria-label="Graphe de toutes les notes et de leurs liens"></canvas>
      <div class="web-top">
        <label class="tog"><input type="checkbox" id="gTags"><span>Étiquettes</span></label>
        <label class="tog"><input type="checkbox" id="gGhosts" checked><span>À écrire</span></label>
        <label class="tog"><input type="checkbox" id="gOrph" checked><span>Isolées</span></label>
      </div>
      <div class="web-zoom">
        <button type="button" class="icon-btn" id="zIn" aria-label="Zoomer"><svg class="ic" viewBox="0 0 24 24"><use href="#i-plus"/></svg></button>
        <button type="button" class="icon-btn" id="zOut" aria-label="Dézoomer"><svg class="ic" viewBox="0 0 24 24"><use href="#i-minus"/></svg></button>
        <button type="button" class="icon-btn" id="zFit" aria-label="Recadrer le graphe"><svg class="ic" viewBox="0 0 24 24"><use href="#i-fit"/></svg></button>
      </div>
      <p class="web-legend" id="legend">&nbsp;</p>
      <div class="card" id="card" hidden></div>
    </section>
  </main>

  <!-- ============ phone tabs ============ -->
  <nav class="tabs" aria-label="Navigation">
    <button type="button" data-go="notes"><svg class="ic" viewBox="0 0 24 24"><use href="#i-notes"/></svg><span>Notes</span></button>
    <button type="button" data-go="page"><svg class="ic" viewBox="0 0 24 24"><use href="#i-page"/></svg><span>Page</span></button>
    <button type="button" data-go="graphe"><svg class="ic" viewBox="0 0 24 24"><use href="#i-web"/></svg><span>Graphe</span></button>
  </nav>

  <!-- ============ floating ============ -->
  <div class="pop" id="syncPop" role="dialog" aria-label="Synchronisation" hidden></div>
  <div class="pop menu" id="shareMenu" role="menu" hidden>
    <button type="button" role="menuitem" id="shNative">Partager…</button>
    <button type="button" role="menuitem" id="shCopy">Copier le texte</button>
    <button type="button" role="menuitem" id="shMd">Télécharger la note (.md)</button>
    <button type="button" role="menuitem" id="shTxt">Télécharger la note (.txt)</button>
    <button type="button" role="menuitem" id="shAll">Télécharger toutes les notes (.json)</button>
  </div>
  <i class="sweep" id="sweep" aria-hidden="true"></i>
  <div class="pop menu" id="menu" role="menu" hidden>
    <button type="button" role="menuitem" id="exportAll">Exporter toutes les notes (.json)</button>
    <button type="button" role="menuitem" id="exportOne">Exporter cette note (.md)</button>
    <button type="button" role="menuitem" id="ghBtn">Synchroniser via GitHub…</button>
    <button type="button" role="menuitem" id="importBtn">Importer des notes (.json, .md)</button>
    <input type="file" id="importFile" accept=".json,.md,.txt,application/json,text/markdown,text/plain" multiple hidden>
  </div>

  <dialog class="dlg" id="ghDlg" aria-labelledby="ghT">
    <form id="ghForm" method="dialog">
      <h3 id="ghT">Synchroniser via GitHub</h3>
      <p>Tes notes sont écrites dans un seul fichier d'un dépôt <b>privé</b> à toi. Fais la même chose sur chaque appareil.</p>
      <label for="ghRepo">Dépôt <span>propriétaire/nom</span></label>
      <input id="ghRepo" type="text" placeholder="LonerFy/grimoire-notes" autocomplete="off" autocapitalize="off" spellcheck="false">
      <label for="ghToken">Jeton d'accès <span>droit Contents : lecture et écriture, sur ce seul dépôt</span></label>
      <input id="ghToken" type="password" placeholder="github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <p class="ghErr" id="ghErr" hidden></p>
      <div class="row">
        <button type="button" class="btn" id="ghOff">Désactiver</button>
        <span class="grow"></span>
        <button type="button" class="btn" id="ghCancel">Fermer</button>
        <button type="submit" class="btn solid" id="ghSave">Enregistrer</button>
      </div>
    </form>
  </dialog>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="app.js"></script>
</body>
</html>
