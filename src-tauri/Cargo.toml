[package]
name = "grimoire"
version = "1.3.1"
description = "Grimoire, notes liées et graphe"
edition = "2021"

[lib]
name = "grimoire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }

# Coffre sécurisé du système. Pas sur Android (non pris en charge) : le jeton y passe par le Keystore, côté Kotlin.
# `v1` active windows-native-keyring-store (Gestionnaire d'identifiants) ; sans elle, la crate ne compile pas.
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "4.2", default-features = false, features = ["v1"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
