name: Build Grimoire
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: SDK et NDK
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: npx tauri android init
      - name: Partage et accès aux fichiers Android
        run: node scripts/android-patch.js
      # Clé de signature stable (secrets GitHub). Rien n'est affiché : pas de set -x, valeurs jamais en argument.
      - name: Clé de signature
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          [ -n "$KS_B64" ]   || { echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent ou vide"; exit 1; }
          [ -n "$KS_PASS" ]  || { echo "::error::Secret ANDROID_KEYSTORE_PASSWORD absent ou vide"; exit 1; }
          [ -n "$KS_ALIAS" ] || { echo "::error::Secret ANDROID_KEY_ALIAS absent ou vide"; exit 1; }
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/grimoire-release.jks" 2>/dev/null \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 n'est pas du base64 valide"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/grimoire-release.jks" -storepass:env KS_PASS -alias "$KS_ALIAS" > /dev/null 2>&1 \
            || { echo "::error::Le keystore ne s'ouvre pas avec ce mot de passe et cet alias"; exit 1; }
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/grimoire-release.jks" >> "$GITHUB_ENV"
          echo "Clé de signature prête."
      # Release signé, arm64 seul (le debug faisait 462 Mo : 4 architectures, symboles de débogage).
      - name: Build release signé (arm64)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: npx tauri android build --apk --target aarch64
      - name: Contrôler et rassembler l'APK
        env:
          EXPECTED_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          apks=$(find src-tauri/gen/android -name "*.apk" -path "*release*" ! -name "*unsigned*")
          if [ "$(printf '%s\n' "$apks" | grep -c .)" != "1" ]; then
            echo "::error::Un seul APK release signé attendu. Trouvés :"; find src-tauri/gen/android -name "*.apk"; exit 1
          fi
          export BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          export EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          bash scripts/check-apk.sh "$apks"
          mkdir -p out
          cp "$apks" out/Grimoire.apk
          ls -l out
      - uses: actions/upload-artifact@v4
        with: { name: Grimoire-android, path: out/Grimoire.apk }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: out/Grimoire.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm install
      - run: npx tauri icon app-icon.png
      - name: Tests Rust (coffre de notes)
        run: cargo test --manifest-path src-tauri/Cargo.toml
      # Preuve que le jeton survit : trois processus distincts sur le vrai Gestionnaire d'identifiants.
      # Un coffre en mémoire échouerait à l'étape 2.
      - name: Gestionnaire d'identifiants, 1/3 écriture
        run: cargo test --manifest-path src-tauri/Cargo.toml persist_1_ecrit -- --ignored
      - name: Gestionnaire d'identifiants, 2/3 relecture (autre processus)
        run: cargo test --manifest-path src-tauri/Cargo.toml persist_2_relit -- --ignored
      - name: Gestionnaire d'identifiants, 3/3 nettoyage
        run: cargo test --manifest-path src-tauri/Cargo.toml persist_3_efface -- --ignored
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: Grimoire-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
